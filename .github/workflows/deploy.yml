name: Test, build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/browser-multiplayer-smoke.mjs
      - run: node scripts/illustration-browser-qa.mjs
      - run: node scripts/illustration-contact-sheet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-bingo-artwork
          path: artifacts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages HTML, scripts, styles and movie catalog
        run: node scripts/verify-live-deployment.mjs "https://bingo.cheeselouisepod.com/"
      - name: Verify real two-player room invitation and independent cards
        run: node scripts/verify-live-room.mjs "https://bingo.cheeselouisepod.com/"
