name: Bingo real-browser smoke checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/browser-multiplayer-smoke.mjs
      - run: node scripts/hq-link-browser-smoke.mjs
      - run: node scripts/illustration-browser-qa.mjs
      - run: node scripts/illustration-contact-sheet.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bingo-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore

