name: Weekly Hallmark discovery review
on:
  workflow_dispatch:
  schedule:
    - cron: '31 13 * * 1'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/build-weekly-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hallmark-weekly-review
          path: research/hallmark-weekly-review.json
          retention-days: 21
