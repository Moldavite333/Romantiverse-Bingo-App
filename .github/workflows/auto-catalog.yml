name: Automatic conservative movie catalog refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * 1,3,5' # Monday, Wednesday, Friday, UTC
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run engine tests
        run: npm test
      - name: Fetch open metadata and import network-qualified movies
        run: node scripts/auto-update-catalog.mjs
      - run: node scripts/validate-catalog.mjs
      - run: npm run build
      - name: Commit catalog changes only if validated and different
        id: catalog_commit
        run: |
          git add public/catalog/movies.json
          if git diff --cached --quiet; then
            echo "No eligible new movies this week"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh eligible open-data Hallmark titles"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue the existing Pages build for a changed main catalog
        if: github.ref == 'refs/heads/main' && steps.catalog_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
