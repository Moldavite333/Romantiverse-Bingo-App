name: Warm verified Bingo poster cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/catalog/movies.json
      - supabase/functions/bingo-public-posters/**
      - .github/workflows/warm-posters.yml
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Request public catalog-aware refresh and verify checked poster coverage
        shell: bash
        run: |
          set -euo pipefail
          url='https://wgvsnmukiaobcbyqhkkt.supabase.co/functions/v1/bingo-public-posters?catalog_check=1'
          for attempt in {1..12}; do
            curl --fail --silent --show-error --retry 2 --max-time 20 "$url" -o /tmp/bingo-posters.json
            echo "Public poster audit attempt $attempt"
            if node scripts/verify-poster-coverage.mjs public/catalog/movies.json /tmp/bingo-posters.json; then
              echo "All eligible catalog titles have been checked; missing verified posters retain fallback artwork."
              exit 0
            fi
            sleep 20
          done
          echo 'Public poster cache still has unprocessed or stale titles after the refresh window' >&2
          exit 1
