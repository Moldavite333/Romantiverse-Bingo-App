name: Native Android build and rules tests
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/catalog/movies.json'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'public/catalog/movies.json'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
jobs:
  native-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test native game rules and build real Android APK
        run: gradle -p android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: romantiverse-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
