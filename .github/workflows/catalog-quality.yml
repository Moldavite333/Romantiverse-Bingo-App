name: Catalog and game engine quality
on:
  push:
    paths:
      - 'public/catalog/**'
      - 'src/engine/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/catalog-quality.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test
      - run: node scripts/validate-catalog.mjs
      - run: npm run build
